<style>

<div class="app">

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pad2 = n => String(n).padStart(2, "0");
function nowStr() { const d = new Date(); return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function toast(msg) { $("toastRoot").innerHTML = '<div class="toast">' + esc(msg) + "</div>"; setTimeout(() => { $("toastRoot").innerHTML = ""; }, 3400); }
function closeModal() { $("modalRoot").innerHTML = ""; }

/* ---------- minimal XLSX writer (stored zip, inline strings) ---------- */
const CRC_TABLE = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(); const chunks = []; const central = []; let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name); const data = enc.encode(f.content); const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(8, 0, true);
    local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true); local.setUint16(26, name.length, true);
    chunks.push(new Uint8Array(local.buffer), name, data);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
    cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
    cen.setUint16(28, name.length, true); cen.setUint32(42, offset, true);
    central.push(new Uint8Array(cen.buffer), name);
    offset += 30 + name.length + data.length;
  });
  let cenSize = 0; central.forEach(c => cenSize += c.length);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cenSize, true); end.setUint32(16, offset, true);
  chunks.push(...central, new Uint8Array(end.buffer));
  return new Blob(chunks, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function colName(i) { let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function sheetXml(rows) {
  const body = rows.map((r, ri) => "<row r=\"" + (ri + 1) + "\">" + r.map((c, ci) => {
    if (c === null || c === undefined || c === "") return "";
    if (typeof c === "number") return "<c r=\"" + colName(ci) + (ri + 1) + "\"><v>" + c + "</v></c>";
    return "<c r=\"" + colName(ci) + (ri + 1) + "\" t=\"inlineStr\"><is><t xml:space=\"preserve\">" + esc(c) + "</t></is></c>";
  }).join("") + "</row>").join("");
  return "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><sheetData>" + body + "</sheetData></worksheet>";
}
function makeXlsx(sheetName, rows) {
  return zipStore([
    { name: "[Content_Types].xml", content: "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/><Override PartName=\"/xl/worksheets/sheet1.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/></Types>" },
    { name: "_rels/.rels", content: "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"xl/workbook.xml\"/></Relationships>" },
    { name: "xl/workbook.xml", content: "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"><sheets><sheet name=\"" + esc(sheetName) + "\" sheetId=\"1\" r:id=\"rId1\"/></sheets></workbook>" },
    { name: "xl/_rels/workbook.xml.rels", content: "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" Target=\"worksheets/sheet1.xml\"/></Relationships>" },
    { name: "xl/worksheets/sheet1.xml", content: sheetXml(rows) }
  ]);
}
function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
</script>
<script>
/* ================= state ================= */
const PAGES = ["一票总览", "资料与预检", "客户确认", "草稿与回件", "套餐与用量"];
const ROLES = ["货代", "出口企业"];
const FIELDS = [
  { key: "qty", label: "件数", key_field: true },
  { key: "weight", label: "毛重", key_field: false },
  { key: "addr", label: "收货人地址", key_field: true },
  { key: "marks", label: "唛头", key_field: false }
];
const ADDR_NEW = "上海市浦东新区临港大道 88 号";
const ADDR_OLD = "上海市浦东新区临港大道 8 号";
const LS_KEY = "yipiao-v2";

function sampleDocs() {
  return [
    { id: "pl", name: "装箱单 Packing List.pdf", src: "出口企业上传", fields: {
      qty: { on: true, v: "100 箱" }, weight: { on: true, v: "2,000 千克" }, addr: { on: false, v: "" }, marks: { on: true, v: "YP-SH-100" } } },
    { id: "ci", name: "商业发票 Commercial Invoice.pdf", src: "出口企业上传", fields: {
      qty: { on: true, v: "100 箱" }, weight: { on: false, v: "" }, addr: { on: true, v: ADDR_NEW }, marks: { on: false, v: "" } } },
    { id: "si", name: "装运指示草稿 Shipping Instruction（待更新）", src: "货代根据旧资料整理", fields: {
      qty: { on: true, v: "120 箱" }, weight: { on: true, v: "2,000 千克" }, addr: { on: true, v: ADDR_OLD }, marks: { on: true, v: "YP-SH-10?", uncertain: true } } }
  ];
}
function caseOrder() {
  return {
    id: "YP-20261116-001", name: "桌椅出口 · 安特卫普-上海", from: "安特卫普（Antwerp）", to: "上海（Shanghai）",
    cargo: "桌椅 / Tables and chairs", bookingNo: "OL-ANR-20261120-001", shipper: "Antwerp Trading BV",
    consignee: "Nord Living（上海）", deadline: "2026-11-19 18:00", invite: "YP16A2B8",
    dataVersion: 2, docs: sampleDocs(), precheck: null, confirmations: {}, confirmRequested: false,
    draft: null, submissions: [], amendments: [], returnDoc: null, returnCheck: null, completed: false,
    msgs: [], log: [{ t: "11/16 09:12", text: "货代创建货单并导入 3 份示例资料（装箱单、商业发票、装运指示草稿）" }],
    history: [{ v: 2, t: "11/16 09:12", text: "当前资料版本 V2：装运指示沿用旧地址与旧件数，待预检核对" }]
  };
}
function blankOrder(id, f) {
  return {
    id: id, name: f.name, from: f.from, to: f.to, cargo: f.cargo, bookingNo: f.bookingNo || "待订舱后补充",
    shipper: f.shipper || "", consignee: f.consignee || "", deadline: f.deadline || "未设置", invite: "YP" + Math.random().toString(36).slice(2, 8).toUpperCase(),
    dataVersion: 1, docs: [], precheck: null, confirmations: {}, confirmRequested: false,
    draft: null, submissions: [], amendments: [], returnDoc: null, returnCheck: null, completed: false,
    msgs: [], log: [{ t: nowStr(), text: "货代新建空白货单（未导入任何资料）" }],
    history: [{ v: 1, t: nowStr(), text: "货单创建，暂无资料" }]
  };
}
function freshState() {
  const o = caseOrder();
  return { page: "一票总览", role: "货代", cur: o.id, orders: [o], billed: [], plan: { price: 600, quota: 50 } };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || freshState(); } catch (e) { S = freshState(); }
if (!S.orders || !S.orders.length) S = freshState();
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
function O() { return S.orders.find(x => x.id === S.cur) || S.orders[0]; }
function log(text) { O().log.unshift({ t: nowStr(), text: text }); }
function hist(text) { O().history.unshift({ v: O().dataVersion, t: nowStr(), text: text }); }

/* ================= precheck engine (data-driven) ================= */
function runPrecheck(order) {
  const rows = FIELDS.map(f => {
    const parts = order.docs.map(d => ({ doc: d.name, f: d.fields[f.key] })).filter(x => x.f && x.f.on);
    let status, detail;
    if (parts.length < 2) { status = "na"; detail = parts.length === 1 ? "仅 1 份资料含此字段，未参与跨文件检查" : "无资料含此字段"; }
    else if (parts.some(x => x.f.uncertain)) { status = "unc"; detail = "有资料识别不确定，需人工核对原文"; }
    else {
      const vals = [...new Set(parts.map(x => x.f.v))];
      if (vals.length === 1) { status = "ok"; detail = "参与检查的资料一致"; }
      else { status = "bad"; detail = "参与检查的资料不一致"; }
    }
    return { key: f.key, label: f.label, key_field: f.key_field, parts: parts, status: status, detail: detail };
  });
  return { version: order.dataVersion, at: nowStr(), rows: rows };
}
function diffs(order) {
  if (!order.precheck || order.precheck.version !== order.dataVersion) return [];
  return order.precheck.rows.filter(r => r.status === "bad");
}
function confirmValid(order, key) {
  const c = order.confirmations[key];
  return !!(c && c.status === "有效" && c.dataVersion === order.dataVersion);
}
function pendingConfirmKeys(order) {
  return diffs(order).filter(r => r.key_field && !confirmValid(order, r.key)).map(r => r.key);
}
function blockers(order) {
  const b = [];
  if (!order.docs.length) b.push({ text: "尚未导入资料，无法开始处理。", page: "资料与预检", act: "去导入资料" });
  else if (!order.precheck || order.precheck.version !== order.dataVersion) b.push({ text: "当前版本 V" + order.dataVersion + " 尚未运行预检。", page: "资料与预检", act: "去运行预检" });
  else {
    diffs(order).forEach(r => {
      if (r.key_field && !confirmValid(order, r.key)) b.push({ text: "关键差异未解决：「" + r.label + "」各资料不一致，且尚无绑定当前版本的有效确认。", page: "客户确认", act: "去处理确认" });
      else if (r.key_field && confirmValid(order, r.key)) b.push({ text: "「" + r.label + "」客户已确认，但装运指示尚未按确认结果更新。", page: "资料与预检", act: "去更新资料" });
      else b.push({ text: "「" + r.label + "」存在不一致（非关键字段），请在草稿中留意。", page: "资料与预检", act: "去查看" });
    });
  }
  if (b.length === 0) {
    if (!order.draft || order.draft.version !== order.dataVersion) b.push({ text: "资料已一致，尚未生成当前版本的草稿。", page: "草稿与回件", act: "去生成草稿" });

  else h += precheckTable(o);
  h += "</div>";
  const appl = ["qty", "addr"].filter(k => confirmValid(o, k) && o.docs.find(d => d.id === "si") && o.docs.find(d => d.id === "si").fields[k].v !== o.confirmations[k].value);
  if (S.role === "货代" && appl.length) h += '<div class="panel"><div class="okbox" style="margin-bottom:10px">客户已确认：' + appl.map(k => FIELDS.find(f => f.key === k).label + " = " + esc(o.confirmations[k].value)).join("；") + '。可一键写入装运指示，生成新版资料。</div><button class="btn" onclick="applyConfirmations()">按确认结果更新装运指示</button></div>';
  return h;
}
function precheckTable(o) {
  const p = o.precheck;
  let h = '<div class="tblwrap" style="margin-top:12px"><table><tr><th style="width:90px">字段</th><th>各资料取值（原文依据）</th><th style="width:110px">状态</th><th style="width:200px">说明</th></tr>';
  p.rows.forEach(r => {
    const vals = r.parts.length ? r.parts.map(x => esc(x.doc.split(" ")[0]) + "：" + esc(x.f.v) + (x.f.uncertain ? "（识别不确定）" : "")).join("<br>") : "—";
    h += "<tr><td>" + r.label + (r.key_field ? ' <span class="pill info">关键</span>' : "") + "</td><td>" + vals + "</td><td>" + statusPill(r.status) + "</td><td>" + esc(r.detail) + "</td></tr>";
  });
  h += '</table></div><p class="muted" style="margin-top:8px">预检时间 ' + p.at + ' · 基于资料版本 V' + p.version + '。「一致 / 不一致 / 未参与检查 / 识别不确定」分别显示，未覆盖项目不会被绿色“通过”掩盖。</p>';
  return h;
}
function confirmItemHtml(o, key) {
  const r = o.precheck.rows.find(x => x.key === key); if (!r) return "";
  const c = o.confirmations[key];
  const valid = confirmValid(o, key);
  const orig = r.parts.map(x => esc(x.doc.split(" ")[0]) + "：" + esc(x.f.v)).join("；");
  let h = '<div class="citem' + (valid ? " done" : "") + '">';
  if (key === "qty") h += '<div class="q">件数不一致：' + orig + '。请确认最终件数并提供依据。</div><div class="orig">原文依据 — ' + orig + '</div>';
  else h += '<div class="q">收货人地址发生变化：' + orig + '。请确认新地址是否用于本票单证。</div><div class="orig">原文依据 — ' + orig + '</div>';
  if (valid) {
    h += '<p style="font-size:13px">✅ 已确认：<b>' + esc(c.value) + '</b>｜依据：' + esc(c.basis) + '<br><span class="muted">确认人：' + c.by + "｜时间：" + c.at + "｜绑定资料版本：V" + c.dataVersion + "</span></p>";
  } else if (c && c.status === "已失效") {
    h += '<div class="warnbox">此前的确认已失效（资料已修改或版本已变更），请重新确认。</div>';
  }
  if (S.role === "出口企业" && !valid) {
    if (key === "qty") h += '<div class="fld"><label>最终件数（箱）</label><input type="number" id="cf_qty" min="1" placeholder="如：100"></div><div class="fld"><label>确认依据（可填写依据说明，附件在下方）</label><input type="text" id="cf_qty_basis" placeholder="如：以装箱单与发票为准，附出库单"></div>';
    else h += '<div class="fld"><label>请选择本票使用的地址</label><label style="display:block;font-size:13px;color:#1f2937;margin:6px 0"><input type="radio" name="cf_addr" value="' + ADDR_NEW + '"> 新地址（商业发票）：' + ADDR_NEW + '</label><label style="display:block;font-size:13px;color:#1f2937"><input type="radio" name="cf_addr" value="' + ADDR_OLD + '"> 旧地址（装运指示）：' + ADDR_OLD + '</label></div><div class="fld"><label>确认依据</label><input type="text" id="cf_addr_basis" placeholder="如：收货人已书面通知变更地址"></div>';
    h += '<div class="fld"><label>附件（可选，演示仅记录文件名）</label><input type="file"></div><button class="btn" data-k="' + key + '" onclick="clientConfirm(this.dataset.k)">确认此项</button>';
  }
  if (S.role === "货代") h += '<p class="muted">' + (valid ? "客户已确认，见上方记录。" : "等待客户确认。货代不能代替客户勾选完成——确认必须由客户在本页作出并绑定版本。") + "</p>";
  h += "</div>";
  return h;
}
function pageConfirm(o) {
  let h = "";
  if (!o.precheck || o.precheck.version !== o.dataVersion) {
    h += '<div class="panel"><h3>客户确认</h3><p class="muted">' + (o.docs.length ? "当前资料版本 V" + o.dataVersion + " 尚未运行预检，暂无可确认事项。货代先在「资料与预检」运行预检，差异会自动生成确认事项。" : "本货单尚无资料。") + "</p></div>";
    return h;
  }
  const keys = diffs(o).filter(r => r.key_field).map(r => r.key);
  const pend = pendingConfirmKeys(o);
  if (S.role === "出口企业") {
    h += '<div class="panel"><h3>待确认事项</h3>';
    if (!keys.length) h += '<div class="okbox">本票暂无需要你确认的争议项。关键字段已跨文件一致，或差异已全部确认。</div>';
    else h += '<p style="font-size:14px;margin-bottom:12px">本票有 <b>' + pend.length + ' 项</b>信息需要你确认。确认后，货代将据此生成新版资料草稿。你不需要看完整工作台，只处理下面这些争议项。</p>' + keys.map(k => confirmItemHtml(o, k)).join("");
    h += "</div>";
  } else {
    h += '<div class="panel"><h3>客户确认（货代视角）</h3>';
    if (!keys.length) h += '<div class="okbox">当前版本无关键差异，无需客户确认。</div>';
    else {
      h += '<p class="muted" style="margin-bottom:10px">争议项由预检差异自动生成。货代整理问题后发送确认请求，客户在自己的入口逐项确认；结果会直接出现在这里，无须重新整理客户回复。</p>';
      if (!o.confirmRequested) h += '<button class="btn" onclick="sendConfirmRequest()">发送确认请求（邀请码 ' + o.invite + '）</button>';
      else h += '<p class="muted" style="margin-bottom:10px">确认请求已发送，等待客户处理（待确认 ' + pend.length + " 项）。</p>";
      h += keys.map(k => confirmItemHtml(o, k)).join("");
    }
    h += "</div>";
  }
  return h;
}
</script>
<script>
function pageDraft(o) {
  let h = '<div class="panel"><h3>草稿生成与下载</h3>';
  const bl = blockers(o);
  const canDraft = o.docs.length && o.precheck && o.precheck.version === o.dataVersion && diffs(o).filter(r => r.key_field).length === 0;
  if (!canDraft) h += '<div class="blocker">尚不能生成草稿：关键差异未解决或当前版本未完成预检，不能进入可提交状态。请先在「资料与预检」「客户确认」处理阻塞问题。</div>';
  else if (S.role === "货代") h += '<button class="btn" onclick="genDraft()">' + (o.draft && o.draft.version === o.dataVersion ? "重新生成草稿" : "生成装运指示草稿") + "</button>";
  if (o.draft) {
    h += '<div class="tblwrap" style="margin-top:12px"><table>' + draftRows(o).map(r => '<tr><th style="width:130px">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>').join("") + '</table></div>';
    h += '<p class="muted" style="margin-top:8px">草稿基于资料版本 V' + o.draft.version + "，生成于 " + o.draft.at + '。下载为 Excel 文件，内容与上表一致；资料修改后重新生成、再次导出即为最新内容。</p>';
    if (S.role === "货代") h += '<button class="btn" onclick="exportDraft()">下载草稿（Excel）</button>';
    if (o.draft.version !== o.dataVersion) h += '<div class="warnbox" style="margin-top:10px">资料已升至 V' + o.dataVersion + "，此草稿为旧版本，请重新生成后再提交。</div>";
  }
  h += "</div>";
  h += '<div class="panel"><h3>提交与回件<span class="tag">船公司反馈并入此模块，用模拟回件展示</span></h3>';
  if (!o.submissions.length) {
    h += '<p class="muted" style="margin-bottom:10px">尚未记录提交。提交沿货代原有渠道进行，本页只记录提交事实与版本。</p>';
    if (S.role === "货代") h += '<button class="btn" ' + (o.draft && o.draft.version === o.dataVersion ? 'onclick="recordSubmit()"' : "disabled") + ">记录提交（提交当前草稿）</button>" + (o.draft && o.draft.version === o.dataVersion ? "" : '<p class="muted" style="margin-top:8px">需先生成当前版本草稿。</p>');
  } else {
    const sub = o.submissions[o.submissions.length - 1];
    h += '<div class="okbox">已提交：' + sub.t + "｜提交版本 V" + sub.version + "｜件数 " + esc(sub.snapshot.qty) + "｜地址 " + esc(sub.snapshot.addr) + "</div>";
    if (o.amendments.length) h += o.amendments.map(a => '<div class="warnbox">' + a.t + "：" + esc(a.text) + "</div>").join("");
    if (!o.returnDoc) {
      h += '<p class="muted" style="margin-bottom:10px">当前状态：<b>等待回件</b>。提交不等于完成，须等回件核对通过。</p>';
      if (S.role === "货代") h += '<button class="btn" onclick="loadReturn(\'old\')">载入模拟提单草稿（回件）</button>';
    } else {
      h += '<div class="tblwrap"><table><tr><th style="width:110px">回件</th><td>' + esc(o.returnDoc.kind) + "｜" + o.returnDoc.at + '</td></tr><tr><th>回件地址</th><td>' + esc(o.returnDoc.fields.addr) + '</td></tr><tr><th>已提交地址</th><td>' + esc(sub.snapshot.addr) + "</td></tr></table></div>";
      if (o.returnCheck && !o.returnCheck.ok) {
        h += '<div class="blocker" style="margin-top:10px">回件核对未通过：' + o.returnCheck.mism.map(m => "「" + m.label + "」回件为 " + esc(m.returned) + "，与已确认版本 " + esc(m.submitted) + " 不一致").join("；") + "，需要继续处理。</div>";
        if (S.role === "货代") h += '<button class="btn" onclick="loadReturn(\'fixed\')">载入修正回件并核对</button>';
      } else if (o.returnCheck && o.returnCheck.ok) {
        h += '<div class="okbox" style="margin-top:10px">回件核对通过：回件与已确认版本一致。</div>';
        if (o.completed) h += '<div class="okbox">✅ 本票资料流程已完成（单证准备与核对完成，不代表货物运输或交付完成）。</div>';
      }
    }
  }
  h += "</div>";
  return h;
}
function pagePlan(o) {
  const used = S.billed.length;
  const left = S.plan.quota - used;
  let h = '<div class="panel"><h3>企业套餐与用量<span class="tag">价格为企划书测试假设，非真实报价</span></h3>';
  h += '<div class="cards" style="margin-bottom:6px"><div class="card"><div class="k">测试套餐</div><div class="v">¥' + S.plan.price + ' / 月</div><div class="d">含 ' + S.plan.quota + ' 票单证处理额度</div></div>'
    + '<div class="card"><div class="k">已处理票数</div><div class="v">' + used + ' 票</div><div class="d">生成草稿即计入，同票重检不重复扣票</div></div>'
    + '<div class="card"><div class="k">剩余额度</div><div class="v">' + left + ' 票</div><div class="d">本月模拟用量</div></div>'
    + '<div class="card"><div class="k">额外人工服务</div><div class="v" style="font-size:14px">另行报价</div><div class="d">超出套餐的人工复核按单沟通报价</div></div></div>';
  h += '<p class="muted">计费口径：一票从生成首份草稿起计 1 票；同票范围内的重新预检、重新导出、回件核对均不重复扣票。本页订单与用量均为模拟数据。</p></div>';
  h += '<div class="panel"><h3>本账号货单（模拟）</h3><div class="tblwrap"><table><tr><th>货单号</th><th>名称</th><th>资料版本</th><th>状态</th><th></th></tr>'
    + S.orders.map(x => "<tr><td>" + x.id + "</td><td>" + esc(x.name) + "</td><td>V" + x.dataVersion + "</td><td>" + (x.completed ? "资料流程完成" : S.billed.includes(x.id) ? "已生成草稿（计票）" : "处理中") + '</td><td><button class="btn ghost sm" data-id="' + x.id + '" onclick="switchOrder(this.dataset.id)">打开</button></td></tr>').join("")
    + "</table></div></div>";
  return h;
}

/* ================= render ================= */
function render() {
  const o = O();
  if (S.role === "出口企业" && S.page !== "客户确认") S.page = "客户确认";
  $("hTitle").textContent = S.role === "货代" ? "货代工作台" : "出口企业确认页";
  $("hSub").textContent = S.role === "货代" ? "导入资料、运行预检、客户确认争议项、生成可继续办理的草稿。" : "你只需确认有争议的内容，确认绑定具体版本，货代据此生成草稿。";
  $("nav").innerHTML = (S.role === "出口企业" ? ["客户确认"] : PAGES).map(p => {
    let badge = "";
    if (p === "客户确认") { const n = pendingConfirmKeys(o).length; if (n) badge = '<span class="badge">' + n + "</span>"; }
    return '<button class="' + (S.page === p ? "on" : "") + '" data-p="' + p + '" onclick="go(this.dataset.p)">' + p + badge + "</button>";
  }).join("");
  const bl = blockers(o);
  $("cards").innerHTML =
    '<div class="card"><div class="k">当前货单</div><div class="v" style="font-size:14px">' + esc(o.name) + '</div><div class="d">' + o.id + " · " + esc(o.from) + " → " + esc(o.to) + "</div></div>"
    + '<div class="card"><div class="k">资料版本</div><div class="v">V' + o.dataVersion + '</div><div class="d">' + (o.draft ? "草稿 V" + o.draft.version + " 已生成" : "尚无草稿") + "</div></div>"
    + '<div class="card"><div class="k">阻塞问题</div><div class="v">' + (o.completed ? "已完成" : bl.length + " 项") + '</div><div class="d">' + (o.completed ? "回件核对通过" : "关键差异未解决不能提交") + "</div></div>"
    + '<div class="card"><div class="k">资料截止</div><div class="v" style="font-size:14px">' + esc(o.deadline) + '</div><div class="d">订舱号 ' + esc(o.bookingNo) + "</div></div>";
  $("roleName").textContent = S.role + (S.role === "货代" ? "（森屿国际货运）" : "（森屿家居 · 出口企业）");
  $("roles").innerHTML = ROLES.map(r => '<button class="' + (S.role === r ? "on" : "") + '" data-r="' + r + '" onclick="setRole(this.dataset.r)">' + r + "</button>").join("") + '<button data-r="" onclick="resetAll()" style="border-color:#fca5a5;color:#b91c1c">重置演示数据</button>';
  $("page").innerHTML = S.page === "一票总览" ? pageOverview(o) : S.page === "资料与预检" ? pageDocs(o) : S.page === "客户确认" ? pageConfirm(o) : S.page === "草稿与回件" ? pageDraft(o) : pagePlan(o);
  $("logBox").innerHTML = o.log.length ? o.log.map(l => '<div><span class="t">' + l.t + "</span>" + esc(l.text) + "</div>").join("") : '<div class="muted">暂无记录。</div>';
  $("histBox").innerHTML = o.history.length ? o.history.map(x => '<div><span class="t">' + x.t + "</span>V" + x.v + "：" + esc(x.text) + "</div>").join("") : '<div class="muted">暂无记录。</div>';
}
save(); render();
</script>
</body>
</html>
